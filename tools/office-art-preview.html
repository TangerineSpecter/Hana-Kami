<!doctype html>
<meta charset="utf-8">
<title>Office art preview</title>
<style>body{margin:0;background:#f7f2e8;font:14px system-ui;color:#493b2f}header{padding:12px}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated}button{margin-left:16px}#status{padding:8px 12px}</style>
<header>办公室实际渲染 <button id="screens">切换电脑亮屏</button><button id="detail">放大桌椅</button></header>
<div id="scene"></div><div id="status">加载中</div>
<script type="module">
import { Application, Texture, Graphics } from 'pixi.js';
import { paintMugRack } from '../src/renderer/src/scene/office/warmOfficeArt.ts';
import { paintTaskBoard } from '../src/renderer/src/scene/office/taskBoardArt.ts';
import { paintOfficeCalendar } from '../src/renderer/src/scene/office/wallFixturesArt.ts';
import { TiledMapRenderer, WARM_OAK_OFFICE_SURFACE_STYLE } from '../src/renderer/src/scene/office/TiledMapRenderer.ts';
import { installExecutiveDesk } from '../src/renderer/src/scene/office/ExecutiveDesk.ts';
import { DeskScreen } from '../src/renderer/src/scene/office/DeskScreen.ts';
import raw from '../src/renderer/src/assets/maps/office.tmj?raw';
import office from '../src/renderer/src/assets/tilesets/office-tileset.png?url';
import walls from '../src/renderer/src/assets/tilesets/a5-office-floors-walls.png?url';
import interiors from '../src/renderer/src/assets/tilesets/interiors.png?url';
const data = JSON.parse(raw);
data.tilesets = [data.tilesets[0], {firstgid:513,columns:16,tilewidth:16,tileheight:16}, {firstgid:1025,columns:16,tilewidth:16,tileheight:16}];
const textures = await Promise.all([office,walls,interiors].map(url => new Promise((resolve,reject) => {
  const image = new Image(); image.onload = () => { const t=Texture.from(image); t.source.scaleMode='nearest'; resolve(t); }; image.onerror=reject; image.src=url;
})));
const app = new Application();
await app.init({width:1632,height:1056,background:0xf7f2e8,antialias:false,resolution:1});
document.querySelector('#scene').append(app.canvas);
const map = new TiledMapRenderer(data,textures,WARM_OAK_OFFICE_SURFACE_STYLE);
installExecutiveDesk(map);
map.getContainer().scale.set(3);
app.stage.addChild(map.getContainer());
const calendar=new Graphics();calendar.position.set(72,21);calendar.zIndex=48;
paintOfficeCalendar(calendar);map.getCharacterContainer().addChild(calendar);
const boardDemo = new URLSearchParams(location.search).has('notes');
for (const [x,kind,color,count] of [[111,'blocked',0xe8a292,3],[145,'todo',0xf0d786,6],[249,'ask',0xcdb4e8,2]]) {
  const board=new Graphics();board.position.set(x,160);board.zIndex=176;
  paintTaskBoard(board,0,kind,boardDemo?Array(count).fill(color):[]);
  map.getCharacterContainer().addChild(board);
}
const rack = new Graphics();
rack.position.set(28*16,15*16);
rack.zIndex=16*16;
paintMugRack(rack,Number(new URLSearchParams(location.search).get('cups') ?? 4));
map.getCharacterContainer().addChild(rack);
const screens=[];
for(let y=0;y<data.height;y++) for(let x=0;x<data.width;x++) if(map.gidAt('furniture-above',x,y)===365) {
  const screen=new DeskScreen(map,{x,y}); screens.push(screen); map.getCharacterContainer().addChild(screen.container);
}
let on=false;
app.ticker.add(ticker=>screens.forEach(s=>s.update(ticker.deltaMS/1000)));
if (new URLSearchParams(location.search).has('desk')) {
  const { Character } = await import('../src/renderer/src/scene/office/Character.ts');
  const { getFeilenFrames } = await import('../src/renderer/src/scene/office/feilenFrames.ts');
  const seat = map.getSpawnPoint('pc-1');
  const actor = new Character({agentId:'desk-preview',mapRenderer:map,frames:getFeilenFrames(),
    seatTile:seat,spawnTile:{x:5,y:14},seatDirection:'up',glowColor:0xffffff});
  actor.show(map.getCharacterContainer());
  actor.walkToAndThen(seat,()=>actor.sitInPlace('up'));
  for(let i=0;i<600;i++) actor.update(1/60);
  screens.forEach(s=>s.setOn(true));
  window.deskCheck=actor.isSitting();
}
document.querySelector('#screens').onclick=()=>{on=!on;screens.forEach(s=>s.setOn(on));};
let detail=false;
document.querySelector('#detail').onclick=()=>{
  detail=!detail;
  map.getContainer().scale.set(detail?9:3);
  map.getContainer().position.set(detail?-144:0,detail?-1584:0);
};
document.querySelector('#status').textContent=`已渲染 ${screens.length} 个工作位 · 地图 ${data.width}×${data.height} · 可切换亮屏检查遮挡`;
if (new URLSearchParams(location.search).has('vending')) {
  const { Character } = await import('../src/renderer/src/scene/office/Character.ts');
  const { getFeilenFrames } = await import('../src/renderer/src/scene/office/feilenFrames.ts');
  const { findPath } = await import('../src/renderer/src/scene/office/pathfinding.ts');
  const stand = map.getSpawnPoint('cafe-stand-vending');
  const start = {x:26,y:16};
  const actor = new Character({agentId:'vending-preview',mapRenderer:map,
    frames:getFeilenFrames(),seatTile:start,glowColor:0xffffff});
  actor.show(map.getCharacterContainer());
  let arrived = false;
  actor.walkToAndThen(stand,()=>{
    arrived=true;actor.setIdle();actor.faceDirection('up');map.setVendingActive(true);
  });
  for(let i=0;i<600;i++) actor.update(1/60);
  const route = findPath(map,start,stand);
  window.vendingCheck = {arrived,stand,frontBlocked:!map.isWalkable(stand.x,stand.y-1),
    routeClear:!!route && route.every(p=>map.isWalkable(p.x,p.y)),leave:()=>{
      let left=false;actor.walkToAndThen(start,()=>{left=true;});
      map.setVendingActive(false);
      for(let i=0;i<600;i++) actor.update(1/60);
      return left;
    }};
}
if (new URLSearchParams(location.search).has('cafe')) {
  const { Character } = await import('../src/renderer/src/scene/office/Character.ts');
  const { getFeilenFrames } = await import('../src/renderer/src/scene/office/feilenFrames.ts');
  const { findPath } = await import('../src/renderer/src/scene/office/pathfinding.ts');
  const exit = {x:25,y:16};
  const actors = [];
  const results = [];
  for (let i=1;i<=4;i++) {
    const seat = map.getSpawnPoint(`cafe-seat-${i}`);
    const facing = seat.y === 14 ? 'down' : 'up';
    const actor = new Character({agentId:`preview-${i}`,mapRenderer:map,
      frames:getFeilenFrames(),seatTile:seat,spawnTile:exit,glowColor:0xffffff});
    actor.show(map.getCharacterContainer());
    let arrived = false;
    actor.walkToAndThen(seat,()=>{arrived=true;actor.sitInPlace(facing);});
    for(let tick=0;tick<600;tick++) actor.update(1/60);
    const route = findPath(map,exit,seat);
    results.push({seat,facing,arrived,seated:actor.isSitting(),
      avoidsTable:!!route && route.every(p=>!(p.y===15 && (p.x===26 || p.x===27)))});
    actors.push(actor);
  }
  window.cafeCheck = {results,leave:()=>actors.map(actor=>{
    let left=false;
    actor.walkToAndThen(exit,()=>{left=true;});
    for(let tick=0;tick<600;tick++) actor.update(1/60);
    return left && !actor.isSitting();
  })};
  document.querySelector('#status').textContent=JSON.stringify(results);
}
</script>
