<!doctype html>
<meta charset="utf-8">
<title>Office art preview</title>
<style>body{margin:0;background:#f7f2e8;font:14px system-ui;color:#493b2f}header{padding:12px}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated}button{margin-left:16px}#status{padding:8px 12px}</style>
<header>办公室实际渲染 <button id="screens">切换电脑亮屏</button><button id="detail">放大桌椅</button></header>
<div id="scene"></div><div id="status">加载中</div>
<script type="module">
import { Application, Texture } from 'pixi.js';
import { TiledMapRenderer, WARM_OAK_OFFICE_SURFACE_STYLE } from '../src/renderer/src/scene/office/TiledMapRenderer.ts';
import { installExecutiveDesk } from '../src/renderer/src/scene/office/ExecutiveDesk.ts';
import { DeskScreen } from '../src/renderer/src/scene/office/DeskScreen.ts';
import raw from '../src/renderer/src/assets/maps/office.tmj?raw';
import office from '../src/renderer/src/assets/tilesets/office-tileset.png?url';
import walls from '../src/renderer/src/assets/tilesets/a5-office-floors-walls.png?url';
import interiors from '../src/renderer/src/assets/tilesets/interiors.png?url';
const data = JSON.parse(raw);
data.tilesets = [data.tilesets[0], {firstgid:513,columns:16,tilewidth:16,tileheight:16}, {firstgid:1025,columns:16,tilewidth:16,tileheight:16}];
const textures = await Promise.all([office,walls,interiors].map(url => new Promise((resolve,reject) => {
  const image = new Image(); image.onload = () => { const t=Texture.from(image); t.source.scaleMode='nearest'; resolve(t); }; image.onerror=reject; image.src=url;
})));
const app = new Application();
await app.init({width:1632,height:1056,background:0xf7f2e8,antialias:false,resolution:1});
document.querySelector('#scene').append(app.canvas);
const map = new TiledMapRenderer(data,textures,WARM_OAK_OFFICE_SURFACE_STYLE);
installExecutiveDesk(map);
map.getContainer().scale.set(3);
app.stage.addChild(map.getContainer());
const screens=[];
for(let y=0;y<data.height;y++) for(let x=0;x<data.width;x++) if(map.gidAt('furniture-above',x,y)===365) {
  const screen=new DeskScreen(map,{x,y}); screens.push(screen); map.getCharacterContainer().addChild(screen.container);
}
let on=false;
document.querySelector('#screens').onclick=()=>{on=!on;screens.forEach(s=>s.setOn(on));};
let detail=false;
document.querySelector('#detail').onclick=()=>{
  detail=!detail;
  map.getContainer().scale.set(detail?9:3);
  map.getContainer().position.set(detail?-144:0,detail?-1584:0);
};
document.querySelector('#status').textContent=`已渲染 ${screens.length} 个工作位 · 地图 ${data.width}×${data.height} · 可切换亮屏检查遮挡`;
</script>
